name: rserial CI

on: [pull_request]

jobs:
  build:
    name: Build and test rserial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build socat

      - name: Ensure test script is executable
        run: chmod +x rlibs/rserial/test/socatfortests.sh

      - name: Configure CMake
        run: cmake -S rlibs/rserial -B rlibs/rserial/build -GNinja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build rlibs/rserial/build --config Release -- -j$(nproc)

      - name: Run tests
        run: ctest --test-dir rlibs/rserial/build --output-on-failure -V
